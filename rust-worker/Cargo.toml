[package]
name = "drift-rust-worker"
version = "0.1.0"
edition = "2021"
authors = ["CutWire Drift High-Performance Team"]
description = "Bare-metal asynchronous media processing worker for CutWire Drift"

[[bin]]
name = "drift-rust-worker"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full", "signal"] }
redis = { version = "0.25", features = ["tokio-comp", "aio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

